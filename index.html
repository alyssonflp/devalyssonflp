<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>axiomOS</title>

    <!-- FONTS CDN -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/interface_3d.css">
    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/dock.css">
    <link rel="stylesheet" href="css/hologram.css">

    <!-- ICONS LUCIDE (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.261.0/dist/lucide.min.js"></script>
</head>
<body>

    <!-- ================================= -->
    <!-- 💻 BOOT / LOGIN -->
    <!-- ================================= -->
    <div id="login-screen">
        <div class="boot-wrapper">
            <h1>axiomOS</h1>
            <input type="password" id="pass-input" placeholder="Digite a senha">
            <div id="boot-progress-bar">
                <div id="boot-progress"></div>
            </div>
            <div id="boot-status">Carregando...</div>
        </div>
    </div>

    <!-- ================================= -->
    <!-- 🖥 DESKTOP / TERMINAL 3D -->
    <!-- ================================= -->
    <div id="desktop-3d" class="hidden">
        <!-- Monitor 3D principal -->
        <div class="main-terminal">
            <div id="root-terminal"></div>
        </div>

        <!-- Dock lateral -->
        <div id="terminal-dock"></div>

        <!-- Footer / System Info -->
        <footer id="info-footer"></footer>
    </div>

    <!-- ================================= -->
    <!-- JS PRINCIPAL -->
    <!-- ================================= -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
