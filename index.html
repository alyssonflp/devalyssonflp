<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alysson OS | v2.6</title>
    <link rel="dns-prefetch" href="https://ipapi.co">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/interface_3d.css">
</head>
<body>

    <section id="login-screen">
        <div class="login-box">
            <img src="./imagens/alysson.png" class="login-avatar" alt="Alysson" 
                 onerror="this.src='https://ui-avatars.com/api/?name=Alysson+Felipe&background=9333ea&color=fff';">
            <h2 class="login-username">alyssonfelipe</h2>
            <div class="login-field">
                <input type="password" id="pass-input" placeholder="••••••••" readonly>
            </div>
            <div class="boot-loader-container">
                <div id="boot-progress" class="boot-loader-bar"></div>
            </div>
            <div id="boot-status">Inicializando sistema...</div>
        </div>
    </section>

    <main id="desktop-3d" class="hidden">
        <section class="main-terminal">
            <article class="terminal-content-wrapper" id="content">
                <div id="root-terminal"></div>
            </article>
        </section>

        <div id="info-footer"></div>
    </main>

    <script type="module" src="js/app.js"></script>
    <script src="js/intro.js"></script>
</body>
</html>
