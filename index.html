<!DOCTYPE html>
<html lang="pt-br">
<head>

            </div>

        </div>
        <div class="win-body" id="content"></div>
    </div>

    <div class="dock-wrap">
        <nav class="dock">
            <div class="dock-i text-blue-500" title="Perfil" onclick="openBio()"><i class="fas fa-user-circle"></i></div>
            <div class="dock-i text-purple-500" title="Educação" onclick="openEdu()"><i class="fas fa-graduation-cap"></i></div>
            <div class="dock-i text-yellow-500" title="Experiências" onclick="openExp()"><i class="fas fa-briefcase"></i></div>
            <div class="dock-i text-orange-500" title="Projetos" onclick="openProject()"><i class="fas fa-code"></i></div>
