<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alysson OS | v2.6</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/interface_3d.css">
</head>
<body>

    <section id="login-screen">
        <div class="login-box">
            <img src="./imagens/alysson.png" class="login-avatar" alt="Alysson" onerror="this.src='https://ui-avatars.com/api/?name=Alysson+Felipe&background=9333ea&color=fff';">
            <h2 class="login-username">alyssonfelipe</h2>
            
            <div class="login-field">
                <input type="password" id="pass-input" readonly>
            </div>

            <div class="boot-loader-container">
                <div id="boot-progress" class="boot-loader-bar"></div>
            </div>
            <div id="boot-status">Inicializando sistema...</div>
        </div>
    </section>

    <main id="desktop-3d" class="hidden">
    <section class="main-terminal">
        <div class="terminal-header">
            <div class="sys-info">
                <i class="fas fa-circle-notch"></i> ALYSSON_FLP.SYS
            </div>
            <div class="nav-tabs">
                <button class="tab">/SOBRE</button>
                <button class="tab">/STACK</button>
                <button class="tab active">/ACERVO</button>
            </div>
        </div>

        <div class="terminal-body" id="content">
            </div>

        <div class="terminal-footer">
            <span>LOC: -25.4284, 49.2733</span>
            <span id="latency">LATENCY. 28ms</span>
            <span>V.2.6.0_STABLE</span>
        </div>
    </section>
</main>


    <script src="js/intro.js"></script>
    <script src="js/interface_3d.js"></script>
</body>
</html>
