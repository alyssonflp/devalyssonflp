<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alysson Felipe | Curriculo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <div id="login-screen">
        <div class="login-box">
            <div class="avatar">
                <i class="fas fa-user-secret"></i>
            </div>
            <input type="password" id="pass-input" readonly placeholder="Acessando sistema...">
            <div id="login-loader" class="loader"></div>
            <p id="login-status">Iniciando protocolos...</p>
        </div>
    </div>

    <div id="hello-screen" style="display: none;">
        <h1 class="glitch" data-text="WELCOME_USER">WELCOME_USER</h1>
    </div>

    <main id="main-terminal" class="terminal-window" style="display: none;">
        <div class="terminal-header">
            <div class="buttons">
                <span class="close" onclick="closeWin()"></span>
                <span class="minimize"></span>
                <span class="maximize"></span>
            </div>
            <div id="win-title" class="title">alyssonfelipe@root: ~</div>
        </div>
        <div id="content" class="terminal-content">
            </div>
    </main>

    <nav id="dock-main" class="dock" style="display: none;">
        <div class="dock-item" onclick="openBio()" title="Perfil">
            <i class="fas fa-id-badge"></i>
        </div>
        <div class="dock-item" onclick="openEdu()" title="Educação">
            <i class="fas fa-user-graduate"></i>
        </div>
        <div class="dock-item" onclick="openExp()" title="Experiência">
            <i class="fas fa-briefcase"></i>
        </div>
        <div class="dock-item" onclick="openProject()" title="Projetos">
            <i class="fas fa-code-branch"></i>
        </div>
        <div class="dock-item" onclick="openContact()" title="Contato">
            <i class="fas fa-envelope"></i>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
