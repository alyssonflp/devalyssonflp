<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alysson Felipe | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="neural-canvas"></canvas>

    <div id="login-screen">
        <div class="login-box">
            <img src="https://github.com/alyssonflp.png" alt="Avatar" class="login-avatar">
            <div class="login-username">alyssonfelipe</div>
            <div class="login-field">
                <input type="password" id="pass-input" readonly>
                <div id="login-loader" class="login-loader" style="display:none;"></div>
            </div>
            <div id="login-status" style="margin-top:10px; font-size:12px; opacity:0.7;">Aguardando credenciais...</div>
        </div>
    </div>

    <div id="hello-screen">
        <div class="hello-text">HELLO WORLD</div>
    </div>

    <div id="main-terminal" class="window">
        <div class="win-header">
            <div class="dots">
                <div class="dot close" onclick="closeWin()"></div>
                <div class="dot min"></div>
                <div class="dot max"></div>
            </div>
            <div id="win-title">alyssonfelipe@root: ~</div>
        </div>
        <div class="win-body" id="content">
            </div>
    </div>

    <div class="dock-wrap" id="dock-main" style="display:none; opacity:0;">
        <div class="dock">
            <div class="dock-i" onclick="openBio()" title="Profile"><i class="fas fa-user-circle"></i></div>
            <div class="dock-i" onclick="openEdu()" title="Education"><i class="fas fa-graduation-cap"></i></div>
            <div class="dock-i" onclick="openExp()" title="Experience"><i class="fas fa-briefcase"></i></div>
            <div class="dock-i" onclick="openProject()" title="Projects"><i class="fas fa-code"></i></div>
            <div class="dock-i" onclick="openContact()" title="Contact"><i class="fas fa-envelope"></i></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
