<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>axiomOS | v2.6</title>

  <!-- DNS Prefetch -->
  <link rel="dns-prefetch" href="https://api.ipify.org" />

  <!-- Google Fonts CDN -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/intro.css" />
  <link rel="stylesheet" href="css/interface_3d.css" />
  <link rel="stylesheet" href="css/terminal.css" />
  <link rel="stylesheet" href="css/dock.css" />
  <link rel="stylesheet" href="css/hologram.css" />

  <!-- Lucide (ícones) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>

  <!-- SVG para efeito holograma -->
  <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
    <defs>
      <filter id="hologram-glow">
        <feGaussianBlur stdDeviation="1" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  </svg>

  <!-- ===============================
       BOOT / LOGIN
  ================================ -->
  <section id="login-screen">
    <div class="login-box">
      <img src="imagens/alysson.png"
           class="login-avatar"
           alt="Alysson"
           onerror="this.src='https://ui-avatars.com/api/?name=Alysson+Felipe&background=9333ea&color=fff';" />
      <h2 class="login-username">alyssonflp</h2>
      <div class="login-field">
        <input type="password" id="pass-input" readonly />
      </div>
      <div class="boot-loader-container">
        <div id="boot-progress" class="boot-loader-bar"></div>
      </div>
      <div id="boot-status">Inicializando sistema...</div>
    </div>
  </section>

  <!-- ===============================
       DESKTOP 3D
  ================================ -->
  <main id="desktop-3d" class="hidden">
    <div class="scanline"></div>
    <section class="main-terminal">
      <article class="terminal-content-wrapper" id="content">
        <div id="root-terminal"></div>
      </article>
      <div id="info-footer"></div>
      <div id="terminal-dock"></div>
    </section>
  </main>

  <!-- ===============================
       SCRIPT PRINCIPAL
  ================================ -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/intro/boot.js"></script>

</body>
          </html>
